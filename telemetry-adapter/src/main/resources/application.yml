server:
  address: ${ADAPTER_BIND_ADDRESS:127.0.0.1}
  port: ${ADAPTER_PORT:8091}

spring:
  application:
    name: telemetry-adapter
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ADAPTER_MYSQL_HOST:127.0.0.1}:${ADAPTER_MYSQL_PORT:3306}/${ADAPTER_MYSQL_DATABASE:iot_adapter}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${ADAPTER_MYSQL_USER:adapter}
    password: ${ADAPTER_MYSQL_PASSWORD:change-me}

adapter:
  profile:
    mode: ${ADAPTER_PROFILE_MODE:jdbc}
    output-version: ${ADAPTER_OUTPUT_VERSION:V2}
    refresh-millis: ${ADAPTER_PROFILE_REFRESH_MS:60000}
    remote:
      base-url: ${ADAPTER_CONFIGURATION_BASE_URL:}
      target-id: ${ADAPTER_TARGET_ID:}
      adapter-key: ${ADAPTER_CONFIGURATION_KEY:}
      snapshot-file: ${ADAPTER_SNAPSHOT_FILE:data/protocol-snapshot.json}
      connect-timeout-millis: ${ADAPTER_CONFIGURATION_CONNECT_TIMEOUT_MILLIS:5000}
      request-timeout-millis: ${ADAPTER_CONFIGURATION_REQUEST_TIMEOUT_MILLIS:10000}
      max-response-bytes: ${ADAPTER_CONFIGURATION_MAX_RESPONSE_BYTES:2097152}
      trust-store: ${ADAPTER_CONFIGURATION_TRUST_STORE:}
      trust-store-password: ${ADAPTER_CONFIGURATION_TRUST_STORE_PASSWORD:}
      trust-store-type: ${ADAPTER_CONFIGURATION_TRUST_STORE_TYPE:PKCS12}
    export-enabled: ${ADAPTER_PROFILE_EXPORT_ENABLED:false}
    export-file: ${ADAPTER_PROFILE_EXPORT_FILE:protocol-migration-export.json}
  mqtt:
    enabled: ${ADAPTER_MQTT_ENABLED:true}
    broker-url: ${ADAPTER_MQTT_BROKER_URL:ssl://127.0.0.1:8883}
    client-id: ${ADAPTER_MQTT_CLIENT_ID:telemetry-adapter-01}
    username: ${ADAPTER_MQTT_USER:adapter}
    password: ${ADAPTER_MQTT_PASSWORD:change-me}
    raw-topic: ${ADAPTER_RAW_TOPIC:device/raw/#}
    standard-topic: ${ADAPTER_STANDARD_TOPIC:platform/telemetry/v2/up}
    application-ack-topic: ${ADAPTER_APPLICATION_ACK_TOPIC:platform/telemetry/v2/ack/adapter}
    max-payload-bytes: ${ADAPTER_MAX_PAYLOAD_BYTES:65536}
    initial-retry-millis: ${ADAPTER_INITIAL_RETRY_MILLIS:5000}
    max-retry-millis: ${ADAPTER_MAX_RETRY_MILLIS:120000}
    security-retry-millis: ${ADAPTER_SECURITY_RETRY_MILLIS:300000}
    retry-multiplier: ${ADAPTER_RETRY_MULTIPLIER:2.0}
    retry-jitter-ratio: ${ADAPTER_RETRY_JITTER_RATIO:0.2}
    tls:
      enabled: ${ADAPTER_MQTT_TLS_ENABLED:true}
      # 仅供隔离自动化测试；研发和部署环境不得用它绕过 TLS。
      allow-plaintext-for-tests: ${ADAPTER_MQTT_ALLOW_PLAINTEXT_TEST_MODE:false}
      trust-store: ${ADAPTER_MQTT_TLS_TRUST_STORE:}
      trust-store-password: ${ADAPTER_MQTT_TLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${ADAPTER_MQTT_TLS_TRUST_STORE_TYPE:PKCS12}
      key-store: ${ADAPTER_MQTT_TLS_KEY_STORE:}
      key-store-password: ${ADAPTER_MQTT_TLS_KEY_STORE_PASSWORD:}
      key-store-type: ${ADAPTER_MQTT_TLS_KEY_STORE_TYPE:PKCS12}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
