name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: |
            pom.xml
            telemetry-adapter/pom.xml

      - name: Show build tool versions
        run: ./mvnw -version

      - name: Test and package backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Test and package cloud telemetry adapter
        run: ./mvnw --batch-mode --no-transfer-progress -f telemetry-adapter/pom.xml verify
