name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-infrastructure:
    name: S02 isolated infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify read-only TDengine exclusive-instance guard
        run: python3 -m unittest discover -s scripts -p test_tdengine_exclusive.py -v
      - name: Verify offline D01 deployment failure guard
        run: python3 -m unittest discover -s scripts/tests -p 'test_*deployment*.py' -v
      - name: Verify D01 frozen backup and staged cutover
        run: python3 -m unittest scripts/tests/test_d01_backup.py scripts/tests/test_d01_release.py -v
      - name: Verify real Redis ACL, Broker authentication and TDengine instance isolation
        env:
          S02_INFRA_IT_ISOLATED: 'true'
        run: python3 scripts/test_s02_infrastructure.py

  account-security-target-engines:
    name: Account security MySQL Redis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: s01-isolated-ci-only
          MYSQL_DATABASE: s01_auth_it
        ports:
          - 3306:3306
        options: >-
          --hostname s01-auth-mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ps01-isolated-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: Bind test to the disposable Redis instance
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          run_id=$(docker exec "$REDIS_CONTAINER" redis-cli --raw INFO server | sed -n 's/^run_id://p' | tr -d '\r')
          test -n "$run_id"
          echo "S01_REDIS_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Verify account locks, versions and failure paths
        env:
          S01_AUTH_IT_ENABLED: "true"
          S01_AUTH_IT_ISOLATED: "true"
          S01_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/s01_auth_it?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=15000
          S01_MYSQL_PASSWORD: s01-isolated-ci-only
          S01_REDIS_PORT: "6379"
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=AccountSecurityMysqlRedisIntegrationTest,BackendDutyMysqlIntegrationTest,RedisAccessIntegrationTest test
      - name: Preserve isolated process test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-security-process-evidence
          path: |
            target/s01-process-tests/
            target/surefire-reports/*AccountSecurityMysqlRedisIntegrationTest*
            target/surefire-reports/*BackendDutyMysqlIntegrationTest*
            target/surefire-reports/*RedisAccessIntegrationTest*
          retention-days: 7

  verify:
    name: Java 21 verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: |
            pom.xml
            telemetry-adapter/pom.xml
            modbus-edge-adapter/pom.xml

      - name: Show build tool versions
        run: ./mvnw -version

      - name: Test and package backend
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Test and package cloud telemetry adapter
        run: ./mvnw --batch-mode --no-transfer-progress -f telemetry-adapter/pom.xml verify

      - name: Test and package Modbus edge adapter
        run: ./mvnw --batch-mode --no-transfer-progress -f modbus-edge-adapter/pom.xml verify

  energy-loop7-target-engines:
    name: Energy loop 7 target engines
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: loop7-root
          MYSQL_DATABASE: iot_platform
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ploop7-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      tdengine:
        image: tdengine/tdengine:3.2.3.0
        ports:
          - 6041:6041
        options: >-
          --health-cmd="curl --fail http://127.0.0.1:6041/rest/login/root/taosdata"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven

      - name: Verify energy loop on MySQL 8 and TDengine 3.2.3
        env:
          ENERGY_LOOP7_MYSQL_IT_URL: jdbc:mysql://127.0.0.1:3306/iot_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          ENERGY_LOOP7_MYSQL_IT_USER: root
          ENERGY_LOOP7_MYSQL_IT_PASSWORD: loop7-root
          ENERGY_LOOP7_MYSQL_IT_ISOLATED: "true"
          ENERGY_LOOP7_TDENGINE_IT_URL: jdbc:TAOS-RS://127.0.0.1:6041?httpConnectTimeout=5000&httpSocketTimeout=30000
          ENERGY_LOOP7_TDENGINE_IT_USER: root
          ENERGY_LOOP7_TDENGINE_IT_PASSWORD: taosdata
          ENERGY_LOOP7_TDENGINE_IT_DATABASE: energy_loop7_it
          ENERGY_LOOP7_TDENGINE_IT_ISOLATED: "true"
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          -Dtest=EnergyLoop7MysqlIntegrationTest,EnergyLoop7TdengineIntegrationTest test
