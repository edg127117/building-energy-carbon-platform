%% The backend consumes EMQX disconnect events for device presence tracking.
%% Keep the exception scoped to the configured local MQTT username.
{allow, {username, "admin"}, subscribe, ["$SYS/brokers/+/clients/+/disconnected"]}.

{allow, {username, {re, "^dashboard$"}}, subscribe, ["$SYS/#"]}.

{allow, {ipaddr, "127.0.0.1"}, all, ["$SYS/#", "#"]}.

{deny, all, subscribe, ["$SYS/#", {eq, "#"}]}.
{allow, all}.
