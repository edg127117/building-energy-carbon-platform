%% 模板中的固定账号须通过受限管理入口创建；远端 Broker 的账号/Topic 契约另行核准。
{allow, {username, "platform-backend"}, subscribe,
 ["device/data/up", "device/telemetry/up", "platform/telemetry/v2/up", "$SYS/brokers/+/clients/+/disconnected"]}.
{allow, {username, "platform-backend"}, publish, ["platform/telemetry/v2/ack/adapter"]}.
{allow, {username, "platform-device"}, publish,
 ["device/data/up", "device/telemetry/up", "platform/telemetry/v2/up"]}.
{allow, {username, "platform-device"}, subscribe, ["platform/telemetry/v2/ack/adapter"]}.
{deny, all}.
