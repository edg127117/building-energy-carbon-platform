version: '3.8'

services:
  # 1. 关系型数据底座 (存放人员、设备台账)
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me} # 与后端环境变量保持一致
      MYSQL_DATABASE: iot_platform       # 启动时自动创建此数据库
      TZ: Asia/Shanghai
    volumes:
      - ./mysql-data:/var/lib/mysql      # 数据持久化，重启不丢数据
      # 仅自动执行全新 MySQL 所需脚本；04/06/07 属于 TDengine，
      # 05 属于旧库手工迁移，均不能交给 MySQL 首次启动自动执行。
      - ./init/01-init-tables.sql:/docker-entrypoint-initdb.d/01-init-tables.sql:ro
      - ./init/02-init-10000-devices.sql:/docker-entrypoint-initdb.d/02-init-10000-devices.sql:ro
      - ./init/03-init-hvac-schema.sql:/docker-entrypoint-initdb.d/03-init-hvac-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # 2. MQTT 消息接入中枢 (接收电表数据)
  emqx:
    image: emqx/emqx:5.6.0
    container_name: iot-emqx
    restart: always
    ports:
      - "1883:1883"       # MQTT 硬件端点
      - "18083:18083"     # Web 管理控制台
      - "8083:8083"       # WebSocket 端口 (日后给前端大屏用)
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MQTT_PASSWORD:-change-me} # 与后端环境变量保持一致
      TZ: Asia/Shanghai

  # 3. 时序数据底座 (存放极高频的电表电压电流)
  tdengine:
    image: tdengine/tdengine:3.2.3.0
    container_name: iot-tdengine
    restart: always
    ports:
      - "6030-6049:6030-6049"
      - "6041:6041"       # REST API 端口 (Java JDBC 使用此端口通信)
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./taos-data:/var/lib/taos        # 时序数据持久化

  # 4. 最新指标状态缓存
  redis:
    image: redis:7.2-alpine
    container_name: iot-redis
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
