services:
  # 1. 关系型数据底座（正式权限、建筑、设备和测点档案）
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-change-me} # 与后端环境变量保持一致
      MYSQL_DATABASE: iot_platform       # 启动时自动创建此数据库
      TZ: Asia/Shanghai
    volumes:
      - ./mysql-data:/var/lib/mysql      # 数据持久化，重启不丢数据
      # 仅自动执行全新 MySQL 所需脚本。已有数据卷不会重跑 init 目录。
      # 04/06/07/09 属于 TDengine，05/08/10 属于旧库手工迁移；
      # 这些脚本都不能挂入 MySQL 首次启动目录。
      - ./init/01-init-tables.sql:/docker-entrypoint-initdb.d/01-init-tables.sql:ro
      - ./init/03-init-hvac-schema.sql:/docker-entrypoint-initdb.d/03-init-hvac-schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 2. MQTT 消息接入中枢（接收 HVAC 19 测点上行）
  emqx:
    image: emqx/emqx:5.6.0
    container_name: iot-emqx
    restart: always
    ports:
      - "1883:1883"       # MQTT 硬件端点
      - "18083:18083"     # Web 管理控制台
      - "8083:8083"       # WebSocket 端口 (日后给前端大屏用)
    environment:
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${MQTT_PASSWORD:-change-me} # 与后端环境变量保持一致
      TZ: Asia/Shanghai
    volumes:
      - ./emqx-acl.conf:/opt/emqx/etc/acl.conf:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 3. 时序数据底座（保存 HVAC 原始事件、分钟数据和指标结果）
  tdengine:
    image: tdengine/tdengine:3.2.3.0
    container_name: iot-tdengine
    # TDengine 会把 FQDN 写入 dnode 元数据；容器重建后 hostname 变化会拒绝启动。
    hostname: iot-tdengine
    restart: always
    ports:
      - "6030-6049:6030-6049"
      - "6041:6041"       # REST API 端口 (Java JDBC 使用此端口通信)
    environment:
      TZ: Asia/Shanghai
      TAOS_FQDN: iot-tdengine
      TAOS_FIRST_EP: iot-tdengine:6030
    volumes:
      # 固定名称 Volume 不依赖短期 Git worktree，删除 worktree 不会删除时序数据。
      - tdengine-data:/var/lib/taos
    healthcheck:
      test: ["CMD-SHELL", "taos -s 'SHOW DATABASES;' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # 4. 最新指标状态缓存
  redis:
    image: redis:7.2-alpine
    container_name: iot-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  tdengine-data:
    # 显式名称保证从不同目录执行 Compose 时仍使用同一个 TDengine 数据卷。
    name: iot-platform-demo-tdengine-data
