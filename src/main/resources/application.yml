server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: iot-platform
  # 排除 Redisson 自动配置，改用 Lettuce（原生 Redis 无密码时 Redisson 无法连接）
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  # 虚拟线程开启 (JDK 21 特性，极大提升 IoT 高并发能力)
  threads:
    virtual:
      enabled: true

  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/iot_platform?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  # Redis 缓存层配置（冻结书 D-010：仅用于缓存，不参与数据写入热路径）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16       # 最大连接数（单实例 16 足够）
          max-idle: 8          # 最大空闲连接
          min-idle: 2          # 最小空闲连接
          max-wait: 2000ms     # 获取连接最大等待时间

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto # 主键自增策略
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志方便调试

# EMQX 配置
mqtt:
  # true：创建 MQTT Client 并订阅 HVAC 上行；false：完全不连接 Broker，供自动化测试隔离。
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:1883}
  client-id: ${MQTT_CLIENT_ID:platform-backend-01}
  username: ${MQTT_USER:admin}
  password: ${MQTT_PASSWORD:change-me}
  topics:
    # 只接收 HVAC 19 测点上报；缺少 pointCode 的旧格式报文会被确认并拒绝。
    upstream: device/data/up

# TDengine 配置 (使用 RESTful 端口 6041)
tdengine:
  # true：应用启动时连接 TDengine 并自动建库、建表；测试环境会覆盖为 false。
  initialization-enabled: true
  url: jdbc:TAOS-RS://${TDENGINE_HOST:127.0.0.1}:${TDENGINE_PORT:6041}
  username: ${TDENGINE_USER:root}
  password: ${TDENGINE_PASSWORD:taosdata}
  database: iot_telemetry
  st-raw-event: st_raw_event

# MySQL 字符集启动修复。true：启动时执行一次 ALTER DATABASE；测试环境会覆盖为 false。
database:
  charset-fix:
    enabled: true

# HVAC 最新快照新鲜度只判断记录是否仍可作为实时值，不推断设备或网络故障原因。
hvac:
  snapshot:
    # 允许短时网络抖动落后一个已冻结分钟；超过后返回 STALE。
    freshness-tolerance-minutes: 1

# HVAC事件时间分钟聚合：窗口始终为一分钟，30秒仅是正常网络延迟的等待时间。
aggregation:
  finalization-delay-seconds: 30
  catch-up-minutes: 10
  scan-delay-ms: 10000
  scan-initial-delay-ms: 10000
  # 最近10分钟只在启动和低频补漏时检查，不再参与每10秒正常聚合。
  recovery-enabled: true
  recovery-delay-ms: 600000

# HVAC 分钟质量补全。首次结果不等待插值窗口：缺少质量0时只使用已批准典型值。
data-quality:
  # false 时不注册质量补全、典型值管理和后台补偿组件；测试环境默认关闭。
  enabled: true
  interpolation:
    # 右侧质量0端点到达后，最多回溯修正5个连续缺失分钟。
    max-gap-minutes: 5
  # 迟到真实值在24小时内可自动替换质量1/2并触发定向重算，超期需人工重算。
  late-real-correction-hours: 24
  # 已批准典型值采用本地完整快照，刷新失败继续使用上一份快照。
  typical-config-refresh-ms: 60000
  # 跨 MySQL/TDengine 不做分布式事务，失败任务按此低频间隔补偿。
  retry-delay-ms: 600000
  # true 时在自然小时结束后核对 TDengine 实际行并一次性收口批次，避免分钟热路径写放大。
  reconciliation-enabled: true
  # 关闭时不注册人工重算接口、Service 和执行器，但不删除已有审计数据。
  recalculation-enabled: true
  # 人工重算每轮只领取有界批次，避免持续轮询占用 MySQL。
  recalculation-scan-delay-ms: 10000
  # RUNNING 批次超过该水位未更新后可被重新领取，用于服务重启和实例故障恢复。
  recalculation-stale-ms: 120000

formula:
  # false 时不创建公式引擎、指标查询 API 和补算任务；测试可据此停止公式业务链路。
  enabled: true
  # 缺少实测湿球温度时，使用该大气压将室外干球温度和相对湿度换算为湿球温度。
  atmospheric-pressure-kpa: ${HVAC_ATMOSPHERIC_PRESSURE_KPA:101.325}
  # 活动指标来自 MySQL，本地快照按此间隔整体替换；刷新失败继续使用上一完整快照。
  indicator-config-refresh-ms: 60000
  # false 时停止启动补算和定时补算，但不影响新冻结分钟的正常公式计算。
  recovery-enabled: true
  # 每轮只检查最近若干个已经越过冻结边界的分钟，避免无界扫描历史数据。
  recovery-minutes: 10
  # 指标补算是低频兜底，不参与每分钟正常计算热路径。
  recovery-delay-ms: 600000

# pointCode 是该来源系统下的别名；来源命名空间只由后端可信配置确定。
ingestion:
  source-system: ${INGESTION_SOURCE_SYSTEM:MQTT_FREEZE_V1}
  point-config-refresh-ms: ${POINT_CONFIG_REFRESH_MS:60000}

# 只清理逐条原始事件；分钟汇总和后续COP指标长期保留。
data-retention:
  raw-event-days: 90
  cleanup-enabled: true
  cleanup-cron: "0 30 3 * * ?"

logging:
  level:
    com.platform: debug

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,threaddump
  metrics:
    export:
      simple:
        enabled: true

# Redisson 分布式锁：本期预留，默认关闭（多实例部署时开启）
redisson:
  enabled: false               # 改为 true 启用 Redisson

security:
  jwt:
    secret: ${JWT_SECRET:iot-platform-demo-jwt-secret-please-change-32-bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
