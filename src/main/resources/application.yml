server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: iot-platform
  # 排除 Redisson 自动配置，改用 Lettuce（原生 Redis 无密码时 Redisson 无法连接）
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  # 虚拟线程开启 (JDK 21 特性，极大提升 IoT 高并发能力)
  threads:
    virtual:
      enabled: true

  # MySQL 配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/iot_platform?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  # MySQL 结构只由应用内 Flyway 版本链推进。非空旧库默认拒绝自动接管，完成结构
  # 核验后才可通过一次性环境变量显式启用 baseline-on-migrate。
  flyway:
    enabled: ${MYSQL_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/mysql
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    baseline-on-migrate: ${MYSQL_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${MYSQL_FLYWAY_BASELINE_VERSION:3}

# Spring 业务定时任务必须使用显式调度器，不能误用 MQTT 或 WebSocket 专用线程。
scheduling:
  business-pool-size: ${BUSINESS_SCHEDULER_POOL_SIZE:4}

  # Redis 缓存层配置（冻结书 D-010：仅用于缓存，不参与数据写入热路径）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16       # 最大连接数（单实例 16 足够）
          max-idle: 8          # 最大空闲连接
          min-idle: 2          # 最小空闲连接
          max-wait: 2000ms     # 获取连接最大等待时间

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto # 主键自增策略
  configuration:
    map-underscore-to-camel-case: true # 下划线转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印 SQL 日志方便调试

# EMQX 配置
mqtt:
  # true：本地平台主动连接云端 EMQX；false：完全不连接 Broker，供自动化测试隔离。
  enabled: ${MQTT_ENABLED:true}
  broker-url: ${MQTT_BROKER_URL:ssl://127.0.0.1:8883}
  client-id: ${MQTT_CLIENT_ID:platform-backend-01}
  username: ${MQTT_USER:admin}
  password: ${MQTT_PASSWORD:change-me}
  initial-retry-millis: ${MQTT_INITIAL_RETRY_MILLIS:5000}
  max-retry-millis: ${MQTT_MAX_RETRY_MILLIS:120000}
  security-retry-millis: ${MQTT_SECURITY_RETRY_MILLIS:300000}
  retry-multiplier: ${MQTT_RETRY_MULTIPLIER:2.0}
  retry-jitter-ratio: ${MQTT_RETRY_JITTER_RATIO:0.2}
  tls:
    enabled: ${MQTT_TLS_ENABLED:true}
    # 仅供隔离自动化测试；研发和部署环境不得用它绕过 TLS。
    allow-plaintext-for-tests: ${MQTT_ALLOW_PLAINTEXT_TEST_MODE:false}
    trust-store: ${MQTT_TLS_TRUST_STORE:}
    trust-store-password: ${MQTT_TLS_TRUST_STORE_PASSWORD:}
    trust-store-type: ${MQTT_TLS_TRUST_STORE_TYPE:PKCS12}
    # key-store 为空时使用单向 TLS；配置后启用客户端证书认证。
    key-store: ${MQTT_TLS_KEY_STORE:}
    key-store-password: ${MQTT_TLS_KEY_STORE_PASSWORD:}
    key-store-type: ${MQTT_TLS_KEY_STORE_TYPE:PKCS12}
  topics:
    # 旧单点协议仅保留迁移窗口；新设备统一走标准多字段主题。
    upstream: ${MQTT_UPSTREAM_TOPIC:device/data/up}
    standard-upstream: ${MQTT_STANDARD_UPSTREAM_TOPIC:device/telemetry/up}
    # 受 ACL 保护的适配器到平台内部 V2 Topic，不要求设备直接发布。
    v2-upstream: ${MQTT_V2_UPSTREAM_TOPIC:platform/telemetry/v2/up}
    # 未绑定设备的永久拒绝也经该可信内部路由通知代理适配器。
    v2-adapter-ack: ${MQTT_V2_ADAPTER_ACK_TOPIC:platform/telemetry/v2/ack/adapter}

# TDengine 配置 (使用 RESTful 端口 6041)
tdengine:
  # true：应用启动时连接 TDengine 并自动建库、建表；测试环境会覆盖为 false。
  initialization-enabled: true
  url: jdbc:TAOS-RS://${TDENGINE_HOST:127.0.0.1}:${TDENGINE_PORT:6041}?httpConnectTimeout=${TDENGINE_HTTP_CONNECT_TIMEOUT_MS:5000}&httpSocketTimeout=${TDENGINE_HTTP_SOCKET_TIMEOUT_MS:30000}
  username: ${TDENGINE_USER:root}
  password: ${TDENGINE_PASSWORD:taosdata}
  database: iot_telemetry
  st-raw-event: st_raw_event

# MySQL 字符集启动修复。true：启动时执行一次 ALTER DATABASE；测试环境会覆盖为 false。
database:
  charset-fix:
    enabled: true

# HVAC 最新快照新鲜度只判断记录是否仍可作为实时值，不推断设备或网络故障原因。
hvac:
  snapshot:
    # 允许短时网络抖动落后一个已冻结分钟；超过后返回 STALE。
    freshness-tolerance-minutes: 1

# HVAC事件时间分钟聚合：窗口始终为一分钟，30秒仅是正常网络延迟的等待时间。
aggregation:
  finalization-delay-seconds: 30
  catch-up-minutes: 10
  scan-delay-ms: 10000
  scan-initial-delay-ms: 10000
  # 最近10分钟只在启动和低频补漏时检查，不再参与每10秒正常聚合。
  recovery-enabled: true
  recovery-delay-ms: 600000

# HVAC 分钟质量补全。首次结果不等待插值窗口：缺少质量0时只使用已批准典型值。
data-quality:
  # false 时不注册质量补全、典型值管理和后台补偿组件；测试环境默认关闭。
  enabled: true
  interpolation:
    # 右侧质量0端点到达后，最多回溯修正5个连续缺失分钟。
    max-gap-minutes: 5
  # 迟到真实值在24小时内可自动替换质量1/2并触发定向重算，超期需人工重算。
  late-real-correction-hours: 24
  # 集中回放只允许有界并发访问 TDengine；队列满时保留原始证据等待低频补偿。
  late-real-correction-concurrency: ${LATE_REAL_CORRECTION_CONCURRENCY:8}
  late-real-correction-queue-capacity: ${LATE_REAL_CORRECTION_QUEUE_CAPACITY:1000}
  # 已批准典型值采用本地完整快照，刷新失败继续使用上一份快照。
  typical-config-refresh-ms: 60000
  # 跨 MySQL/TDengine 不做分布式事务，失败任务按此低频间隔补偿。
  retry-delay-ms: 600000
  # true 时在自然小时结束后核对 TDengine 实际行并一次性收口批次，避免分钟热路径写放大。
  reconciliation-enabled: true
  # 关闭时不注册人工重算接口、Service 和执行器，但不删除已有审计数据。
  recalculation-enabled: true
  # 人工重算每轮只领取有界批次，避免持续轮询占用 MySQL。
  recalculation-scan-delay-ms: 10000
  # RUNNING 批次超过该水位未更新后可被重新领取，用于服务重启和实例故障恢复。
  recalculation-stale-ms: 120000
  # MySQL WAITING 是持久化队列；工作线程满时领取会安全回退，不进入 JVM 等待队列。
  recalculation-worker-concurrency: ${RECALCULATION_WORKER_CONCURRENCY:2}

# Q0/Q1/Q2 使用策略只治理消费。修订检查、实时纠正、指标恢复和投影对账均有界，
# 不与采集线程、设备采样周期或质量生成参数共用执行队列。
quality-usage:
  revision-check-ms: ${QUALITY_USAGE_REVISION_CHECK_MS:60000}
  recovery-batch-size: ${QUALITY_USAGE_RECOVERY_BATCH_SIZE:500}
  realtime-correction-queue-capacity: ${QUALITY_USAGE_REALTIME_QUEUE_CAPACITY:1000}
  realtime-correction-concurrency: ${QUALITY_USAGE_REALTIME_CONCURRENCY:1}
  indicator-recovery-queue-capacity: ${QUALITY_USAGE_INDICATOR_QUEUE_CAPACITY:500}
  indicator-recovery-concurrency: ${QUALITY_USAGE_INDICATOR_CONCURRENCY:1}
  reconciliation-batch-size: ${QUALITY_USAGE_RECONCILIATION_BATCH_SIZE:200}
  reconciliation-delay-ms: ${QUALITY_USAGE_RECONCILIATION_DELAY_MS:60000}

formula:
  # false 时不创建公式引擎、指标查询 API 和补算任务；测试可据此停止公式业务链路。
  enabled: true
  # 缺少实测湿球温度时，使用该大气压将室外干球温度和相对湿度换算为湿球温度。
  atmospheric-pressure-kpa: ${HVAC_ATMOSPHERIC_PRESSURE_KPA:101.325}
  # 活动指标来自 MySQL，本地快照按此间隔整体替换；刷新失败继续使用上一完整快照。
  indicator-config-refresh-ms: 60000
  # false 时停止启动补算和定时补算，但不影响新冻结分钟的正常公式计算。
  recovery-enabled: true
  # 每轮只检查最近若干个已经越过冻结边界的分钟，避免无界扫描历史数据。
  recovery-minutes: 10
  # 指标补算是低频兜底，不参与每分钟正常计算热路径。
  recovery-delay-ms: 600000

# pointCode 是该来源系统下的别名；来源命名空间只由后端可信配置确定。
ingestion:
  source-system: ${INGESTION_SOURCE_SYSTEM:MQTT_FREEZE_V1}
  standard-source-system: ${INGESTION_STANDARD_SOURCE_SYSTEM:MQTT_STANDARD_V1}
  point-config-refresh-ms: ${POINT_CONFIG_REFRESH_MS:60000}
  device-identity-refresh-ms: ${DEVICE_IDENTITY_REFRESH_MS:60000}

# 治理配置提交后立即刷新；该周期只用于失败兜底，不代表设备采样周期。
collection:
  runtime-refresh-ms: ${COLLECTION_RUNTIME_REFRESH_MS:60000}

# 未绑定设备只保存本地 MySQL 中的规范化有限样例，不进入 TDengine 和数据质量链。
device-onboarding:
  discovery:
    max-metric-count: ${PENDING_DEVICE_MAX_METRIC_COUNT:64}
    max-string-length: ${PENDING_DEVICE_MAX_STRING_LENGTH:128}
    max-sample-bytes: ${PENDING_DEVICE_MAX_SAMPLE_BYTES:8192}
    max-attempts: ${PENDING_DEVICE_MAX_ATTEMPTS:3}
    retry-delay-ms: ${PENDING_DEVICE_RETRY_DELAY_MS:50}
    cleanup-enabled: ${PENDING_DEVICE_CLEANUP_ENABLED:true}
    retention-days: ${PENDING_DEVICE_RETENTION_DAYS:30}
    cleanup-batch-size: ${PENDING_DEVICE_CLEANUP_BATCH_SIZE:200}
    cleanup-max-batches: ${PENDING_DEVICE_CLEANUP_MAX_BATCHES:5}
    cleanup-timeout-ms: ${PENDING_DEVICE_CLEANUP_TIMEOUT_MS:5000}
    cleanup-cron: ${PENDING_DEVICE_CLEANUP_CRON:0 45 3 * * ?}

# 厂家参数报文契约未确认前保持关闭；启用时必须显式声明已经确认的 FULL/DELTA 语义。
device-parameter:
  ingest:
    enabled: ${DEVICE_PARAMETER_INGEST_ENABLED:false}
    allowed-semantics: ${DEVICE_PARAMETER_ALLOWED_SEMANTICS:}
    max-items: ${DEVICE_PARAMETER_MAX_ITEMS:128}
  importing:
    max-file-bytes: ${DEVICE_PARAMETER_IMPORT_MAX_FILE_BYTES:2000000}
    max-rows: ${DEVICE_PARAMETER_IMPORT_MAX_ROWS:5000}
    max-text-length: ${DEVICE_PARAMETER_IMPORT_MAX_TEXT_LENGTH:255}
  recalculation:
    enabled: ${DEVICE_PARAMETER_RECALCULATION_ENABLED:true}
    delay-ms: ${DEVICE_PARAMETER_RECALCULATION_DELAY_MS:60000}
    batch-size: ${DEVICE_PARAMETER_RECALCULATION_BATCH_SIZE:2}
    max-retries: ${DEVICE_PARAMETER_RECALCULATION_MAX_RETRIES:5}
    chunk-minutes: ${DEVICE_PARAMETER_RECALCULATION_CHUNK_MINUTES:60}

# 只清理逐条原始事件；分钟汇总和后续COP指标长期保留。
data-retention:
  raw-event-days: ${TDENGINE_RAW_RETENTION_DAYS:90}
  cleanup-enabled: ${TDENGINE_RAW_CLEANUP_ENABLED:true}
  cleanup-cron: "${TDENGINE_RAW_CLEANUP_CRON:0 30 3 * * ?}"

# 当前值仅用于研发和软件模拟，生产部署必须结合容量与合规要求重新批准。
telemetry-reliability:
  retention:
    receipt-hours: ${TELEMETRY_RECEIPT_RETENTION_HOURS:24}
    failure-days: ${TELEMETRY_FAILURE_RETENTION_DAYS:180}
    cleanup-delay-ms: ${TELEMETRY_RETENTION_CLEANUP_DELAY_MS:60000}
    batch-size: ${TELEMETRY_RETENTION_BATCH_SIZE:2000}
    max-batches: ${TELEMETRY_RETENTION_MAX_BATCHES:10}
    max-run-millis: ${TELEMETRY_RETENTION_MAX_RUN_MILLIS:30000}

logging:
  level:
    com.platform: debug

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,threaddump
  metrics:
    export:
      simple:
        enabled: true

# Redisson 分布式锁：本期预留，默认关闭（多实例部署时开启）
redisson:
  enabled: false               # 改为 true 启用 Redisson

security:
  jwt:
    secret: ${JWT_SECRET:iot-platform-demo-jwt-secret-please-change-32-bytes-min}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
