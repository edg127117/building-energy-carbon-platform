spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  # H2 测试继续使用受控 schema-test.sql；MySQL Flyway 脚本只在专用 MySQL 8
  # 集成环境执行，避免普通单元测试连接或模拟真实外部资源。
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql,classpath:device-parameter-schema-test.sql,classpath:audit-governance-schema-test.sql
      data-locations: classpath:data-test.sql

audit-governance:
  environment-mode: TEST
  allow-self-approval: true
  password-token-ttl: PT15M
  retention-cleanup-enabled: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 测试使用 H2，不允许字符集修复程序向真实 MySQL 执行 ALTER DATABASE。
database:
  charset-fix:
    enabled: false

# 测试不运行 TDengine 的启动初始化任务，因此不会自动建库、建表。
tdengine:
  initialization-enabled: false

# 普通自动化测试不创建 MQTT Client，也不会连接或订阅真实 EMQX。
mqtt:
  enabled: false

# 普通测试按需直接调用待绑定清理服务，不启动后台清理调度。
device-onboarding:
  discovery:
    cleanup-enabled: false

# 自动化测试直接调用聚合方法；关闭后台恢复，避免测试上下文访问真实TDengine。
aggregation:
  recovery-enabled: false
  scan-initial-delay-ms: 3600000

# 普通自动化测试不注册质量补全和跨库收口任务；专项测试会显式开启并使用 Fake/Mock。
data-quality:
  enabled: false
  reconciliation-enabled: false
  # 普通自动化测试不启动人工重算调度；专项测试使用 Mock/Fake 后显式开启。
  recalculation-enabled: false

formula:
  enabled: true
  atmospheric-pressure-kpa: 101.325
  indicator-config-refresh-ms: 60000
  recovery-enabled: false
  recovery-minutes: 10
  recovery-delay-ms: 3600000

relation-governance:
  deployment-environment: test
  self-approval-enabled: false
  max-context-depth: 3
  max-page-size: 100

# 普通自动化测试不领取碳重算持久化任务；专项测试直接调用服务方法。
carbon-management:
  recalculation-enabled: false
